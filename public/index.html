<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠管理システム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>勤怠管理システム</h1>
    <div id="current-time"></div>
  </header>

  <nav>
    <button class="nav-btn active" data-tab="stamp">打刻</button>
    <button class="nav-btn" data-tab="today">本日の勤怠</button>
    <button class="nav-btn" data-tab="history">勤怠履歴</button>
    <button class="nav-btn" data-tab="monthly">月次集計</button>
    <button class="nav-btn" data-tab="employees">従業員管理</button>
  </nav>

  <main>
    <!-- 打刻タブ -->
    <section id="tab-stamp" class="tab-content active">
      <h2>打刻</h2>
      <div class="card">
        <label for="stamp-employee">従業員選択</label>
        <select id="stamp-employee">
          <option value="">-- 従業員を選択 --</option>
        </select>
        <div class="stamp-buttons">
          <button id="btn-clock-in" class="btn btn-in">出勤</button>
          <button id="btn-clock-out" class="btn btn-out">退勤</button>
        </div>
        <div id="stamp-message" class="message"></div>
      </div>
    </section>

    <!-- 本日の勤怠タブ -->
    <section id="tab-today" class="tab-content">
      <h2>本日の勤怠状況</h2>
      <div class="card">
        <button class="btn btn-refresh" onclick="loadToday()">更新</button>
        <div class="table-wrapper">
          <table id="today-table">
            <thead>
              <tr>
                <th>社員ID</th>
                <th>氏名</th>
                <th>部署</th>
                <th>出勤時刻</th>
                <th>退勤時刻</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="today-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 勤怠履歴タブ -->
    <section id="tab-history" class="tab-content">
      <h2>勤怠履歴</h2>
      <div class="card">
        <div class="filter-row">
          <div class="filter-item">
            <label for="history-employee">従業員</label>
            <select id="history-employee">
              <option value="">全員</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="history-start">開始日</label>
            <input type="date" id="history-start">
          </div>
          <div class="filter-item">
            <label for="history-end">終了日</label>
            <input type="date" id="history-end">
          </div>
          <button class="btn btn-search" onclick="loadHistory()">検索</button>
        </div>
        <div class="table-wrapper">
          <table id="history-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>社員ID</th>
                <th>氏名</th>
                <th>部署</th>
                <th>出勤時刻</th>
                <th>退勤時刻</th>
                <th>勤務時間</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 月次集計タブ -->
    <section id="tab-monthly" class="tab-content">
      <h2>月次集計</h2>
      <div class="card">
        <div class="filter-row">
          <div class="filter-item">
            <label for="monthly-year">年</label>
            <input type="number" id="monthly-year" min="2020" max="2099" style="width:80px">
          </div>
          <div class="filter-item">
            <label for="monthly-month">月</label>
            <input type="number" id="monthly-month" min="1" max="12" style="width:60px">
          </div>
          <button class="btn btn-search" onclick="loadMonthly()">集計</button>
        </div>
        <div id="monthly-label" class="monthly-label"></div>
        <div class="table-wrapper">
          <table id="monthly-table">
            <thead>
              <tr>
                <th>社員ID</th>
                <th>氏名</th>
                <th>部署</th>
                <th>出勤日数</th>
                <th>総勤務時間</th>
              </tr>
            </thead>
            <tbody id="monthly-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 従業員管理タブ -->
    <section id="tab-employees" class="tab-content">
      <h2>従業員管理</h2>
      <div class="card">
        <h3>従業員追加</h3>
        <div class="form-row">
          <div class="form-item">
            <label for="new-emp-id">社員ID</label>
            <input type="text" id="new-emp-id" placeholder="例: E004">
          </div>
          <div class="form-item">
            <label for="new-emp-name">氏名</label>
            <input type="text" id="new-emp-name" placeholder="例: 田中 次郎">
          </div>
          <div class="form-item">
            <label for="new-emp-dept">部署</label>
            <input type="text" id="new-emp-dept" placeholder="例: 開発部">
          </div>
          <button class="btn btn-add" onclick="addEmployee()">追加</button>
        </div>
        <div id="emp-message" class="message"></div>
        <h3>従業員一覧</h3>
        <div class="table-wrapper">
          <table id="emp-table">
            <thead>
              <tr>
                <th>社員ID</th>
                <th>氏名</th>
                <th>部署</th>
                <th>登録日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="emp-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
