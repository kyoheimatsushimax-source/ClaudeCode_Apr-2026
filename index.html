<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .display {
            font-size: 3.5em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin: 30px 0;
            min-height: 80px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .start-btn {
            background: #667eea;
            color: white;
        }

        .start-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stop-btn {
            background: #f56565;
            color: white;
        }

        .stop-btn:hover:not(:disabled) {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .reset-btn {
            background: #48bb78;
            color: white;
        }

        .reset-btn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .laps {
            margin-top: 30px;
            text-align: left;
        }

        .laps h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .lap-list {
            background: #f7fafc;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
        }

        .lap-item {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            color: #555;
            font-family: 'Courier New', monospace;
        }

        .lap-item:last-child {
            border-bottom: none;
        }

        .lap-time {
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Stopwatch</h1>

        <div class="display" id="display">00:00.00</div>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="stop-btn" id="stopBtn" disabled>Stop</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
            <button class="reset-btn" id="lapBtn" disabled>Lap</button>
        </div>

        <div class="laps">
            <h3>Laps</h3>
            <div class="lap-list" id="lapList"></div>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let laps = [];

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapBtn = document.getElementById('lapBtn');
        const lapList = document.getElementById('lapList');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
        }

        function updateDisplay() {
            const currentTime = elapsedTime + (Date.now() - startTime);
            display.textContent = formatTime(currentTime);
        }

        function start() {
            if (!isRunning) {
                startTime = Date.now();
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                lapBtn.disabled = false;

                timerInterval = setInterval(updateDisplay, 10);
            }
        }

        function stop() {
            if (isRunning) {
                clearInterval(timerInterval);
                elapsedTime += Date.now() - startTime;
                isRunning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                lapBtn.disabled = true;
            }
        }

        function reset() {
            clearInterval(timerInterval);
            startTime = 0;
            elapsedTime = 0;
            isRunning = false;
            laps = [];

            display.textContent = '00:00.00';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            lapBtn.disabled = true;
            lapList.innerHTML = '';
        }

        function recordLap() {
            if (isRunning) {
                const currentTime = elapsedTime + (Date.now() - startTime);
                const lapTime = laps.length === 0
                    ? currentTime
                    : currentTime - laps.reduce((sum, lap) => sum + lap, 0);

                laps.push(lapTime);

                const lapItem = document.createElement('div');
                lapItem.className = 'lap-item';
                lapItem.innerHTML = `
                    <span>Lap ${laps.length}</span>
                    <span class="lap-time">${formatTime(lapTime)}</span>
                `;

                if (lapList.firstChild) {
                    lapList.insertBefore(lapItem, lapList.firstChild);
                } else {
                    lapList.appendChild(lapItem);
                }
            }
        }

        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', stop);
        resetBtn.addEventListener('click', reset);
        lapBtn.addEventListener('click', recordLap);
    </script>
</body>
</html>
