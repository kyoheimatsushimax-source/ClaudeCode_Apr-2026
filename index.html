<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none';" />
<title>かんたん家計簿</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --income: #10b981;
    --expense: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 20px; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav button {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
  }
  .month-nav button:hover { background: var(--bg); }
  .month-label { font-weight: 600; min-width: 110px; text-align: center; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr; }
    .summary, .form-card { grid-column: 1 / -1; }
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .summary-item {
    text-align: center;
    padding: 12px;
  }
  .summary-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .summary-value { font-size: 24px; font-weight: 700; }
  .summary-value.income { color: var(--income); }
  .summary-value.expense { color: var(--expense); }
  .summary-value.balance { color: var(--primary); }
  h2 { font-size: 16px; margin: 0 0 16px; }
  form { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 700px) {
    form { grid-template-columns: 120px 120px 140px 1fr 120px auto; align-items: end; }
  }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select, button {
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    width: 100%;
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  button.primary {
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
    padding: 9px 16px;
  }
  button.primary:hover { background: var(--primary-hover); }
  .type-toggle { display: flex; gap: 0; }
  .type-toggle button {
    flex: 1;
    border: 1px solid var(--border);
    background: white;
    cursor: pointer;
    padding: 8px;
    font-size: 14px;
  }
  .type-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .type-toggle button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .type-toggle button.active.income { background: var(--income); color: white; border-color: var(--income); }
  .type-toggle button.active.expense { background: var(--expense); color: white; border-color: var(--expense); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.amount.income { color: var(--income); }
  td.amount.expense { color: var(--expense); }
  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    font-size: 16px;
    width: auto;
  }
  .delete-btn:hover { color: var(--expense); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 16px;
    font-size: 14px;
  }
  .chart-container { position: relative; height: 280px; }
  .chart-container.wide { height: 320px; }
  .budget-list { display: grid; gap: 14px; }
  .budget-row { }
  .budget-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .budget-cat { font-weight: 600; }
  .budget-nums { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .budget-nums .pct { margin-left: 8px; font-weight: 600; }
  .bar-bg {
    height: 10px;
    background: var(--bg);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    background: var(--income);
    transition: width 0.3s ease;
  }
  .bar-fill.warn { background: #f59e0b; }
  .bar-fill.over { background: var(--expense); }
  .budget-edit {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: end;
  }
  .budget-edit select, .budget-edit input { width: auto; flex: 1; min-width: 100px; }
  .budget-edit button { width: auto; }
  .budget-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0;
  }
  .cc-import-box {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
  }
  .cc-import-box.dragover { border-color: var(--primary); background: #eff6ff; }
  .cc-import-box p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .cc-import-box button { width: auto; }
  .preview-table-wrap {
    max-height: 320px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 12px 0;
  }
  .preview-table-wrap table { font-size: 12px; }
  .preview-table-wrap th { position: sticky; top: 0; background: var(--card); }
  .preview-table-wrap tr.dup { opacity: 0.4; background: #fef3c7; }
  .modal.wide { max-width: 640px; }
  .modal-stats { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; margin-bottom: 8px; }
  .modal-stats span { color: var(--muted); }
  .modal-stats span b { color: var(--text); }
  .tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tools button {
    width: auto;
    background: white;
    cursor: pointer;
    font-size: 13px;
    padding: 6px 12px;
  }
  .tools button:hover { background: var(--bg); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    background: var(--bg);
    color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>かんたん家計簿</h1>
  <div class="month-nav">
    <button id="prev-month" aria-label="前の月">‹</button>
    <span class="month-label" id="month-label"></span>
    <button id="next-month" aria-label="次の月">›</button>
  </div>
  <div class="tools">
    <button id="export-btn">エクスポート</button>
    <button id="import-btn">インポート</button>
    <input type="file" id="import-file" accept="application/json" style="display:none" />
  </div>
</header>

<main>
  <section class="card summary">
    <div class="summary-item">
      <div class="summary-label">収入</div>
      <div class="summary-value income" id="total-income">¥0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">支出</div>
      <div class="summary-value expense" id="total-expense">¥0</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">収支</div>
      <div class="summary-value balance" id="total-balance">¥0</div>
    </div>
  </section>

  <section class="card form-card">
    <h2>記録を追加</h2>
    <form id="entry-form">
      <div>
        <label>種類</label>
        <div class="type-toggle">
          <button type="button" data-type="income" class="active income">収入</button>
          <button type="button" data-type="expense">支出 (保育料など)</button>
        </div>
        <input type="hidden" id="type" value="income" />
      </div>
      <div>
        <label for="date">日付</label>
        <input type="date" id="date" required />
      </div>
      <div>
        <label for="category">カテゴリ</label>
        <select id="category" required></select>
      </div>
      <div>
        <label for="memo">メモ</label>
        <input type="text" id="memo" placeholder="例: スーパーで買い物" />
      </div>
      <div>
        <label for="amount">金額</label>
        <input type="number" id="amount" min="1" step="1" required placeholder="0" />
      </div>
      <div>
        <button type="submit" class="primary">追加</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>カテゴリ別 支出</h2>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </section>

  <section class="card">
    <h2>予算 達成状況</h2>
    <div class="budget-list" id="budget-list"></div>
    <div class="budget-edit">
      <div style="flex:1; min-width:140px;">
        <label for="budget-category">カテゴリ</label>
        <select id="budget-category"></select>
      </div>
      <div style="flex:1; min-width:120px;">
        <label for="budget-amount">月予算 (円)</label>
        <input type="number" id="budget-amount" min="0" step="100" placeholder="0" />
      </div>
      <button type="button" class="primary" id="budget-save" style="width:auto;">保存</button>
    </div>
  </section>

  <section class="card form-card">
    <h2>クレカ明細インポート</h2>
    <div class="cc-import-box" id="cc-drop">
      <p>Excel ファイル (.xlsx / .xls) をドラッグ&ドロップ、またはクリックして選択<br>
      取り込み内容を確認してから登録できます。日付・金額・店舗を自動検出します。</p>
      <button type="button" class="primary" id="cc-pick-btn">ファイルを選択</button>
      <input type="file" id="cc-file" accept=".xlsx,.xls" style="display:none" />
    </div>
  </section>

  <section class="card form-card">
    <h2>年間推移 (収入・支出・収支)</h2>
    <div class="chart-container wide">
      <canvas id="yearly-chart"></canvas>
    </div>
  </section>

  <section class="card form-card">
    <h2>明細 <span class="badge" id="entry-count">0件</span></h2>
    <div id="entries-wrap">
      <table id="entries-table">
        <thead>
          <tr>
            <th>日付</th>
            <th>カテゴリ</th>
            <th>メモ</th>
            <th style="text-align:right">金額</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
      <div class="empty" id="empty-msg" style="display:none">この月の記録はまだありません</div>
    </div>
  </section>
</main>

<div id="cc-preview-overlay" class="modal-overlay" style="display:none">
  <div class="modal wide">
    <h2>クレカ明細プレビュー</h2>
    <div class="modal-stats" id="cc-stats"></div>
    <div class="preview-table-wrap" id="cc-preview-wrap"></div>
    <p style="font-size:12px; color: var(--muted); margin: 0 0 12px;">
      黄色の行は既存データと重複しているためスキップされます。
    </p>
    <div class="modal-actions">
      <button type="button" id="cc-cancel">キャンセル</button>
      <button type="button" class="primary" id="cc-confirm">登録する</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'kakeibo.entries.v1';
  const BUDGET_KEY = 'kakeibo.budgets.v1';
  const CATEGORIES = {
    income: ['給与(自分)', '給与(妻)', '補助金(保育料)', '補助金(児童手当)', '補助金(区手当)'],
    expense: ['クレカ', '保育料'],
  };
  const CATEGORIES_LEGACY = {
    income: ['給与', '副業', 'ボーナス', '臨時収入', 'その他'],
    expense: ['食費', '日用品', '住居', '光熱費', '通信', '交通', '医療', '娯楽', '衣服', '教育', 'その他'],
  };
  function allCategories(type) { return CATEGORIES[type].concat(CATEGORIES_LEGACY[type]); }
  const COLORS = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#6366f1', '#64748b'];

  let entries = load();
  let budgets = loadBudgets();
  let viewMonth = new Date();
  viewMonth.setDate(1);
  let currentType = 'expense';
  let chart = null;
  let yearlyChart = null;

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
  function loadBudgets() {
    try { return JSON.parse(localStorage.getItem(BUDGET_KEY)) || {}; }
    catch { return {}; }
  }
  function saveBudgets() { localStorage.setItem(BUDGET_KEY, JSON.stringify(budgets)); }
  function fmt(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
  function ym(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function monthLabel(d) { return d.getFullYear() + '年 ' + (d.getMonth() + 1) + '月'; }

  function refreshCategories() {
    const sel = document.getElementById('category');
    sel.innerHTML = CATEGORIES[currentType].map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function setType(t) {
    currentType = t;
    document.getElementById('type').value = t;
    document.querySelectorAll('.type-toggle button').forEach(b => {
      b.classList.remove('active', 'income', 'expense');
      if (b.dataset.type === t) b.classList.add('active', t);
    });
    refreshCategories();
  }

  function render() {
    document.getElementById('month-label').textContent = monthLabel(viewMonth);
    const monthKey = ym(viewMonth);
    const monthEntries = entries
      .filter(e => e.date.startsWith(monthKey))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    const income = monthEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const expense = monthEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    document.getElementById('total-income').textContent = fmt(income);
    document.getElementById('total-expense').textContent = fmt(expense);
    const bal = income - expense;
    const balEl = document.getElementById('total-balance');
    balEl.textContent = (bal >= 0 ? '' : '-') + fmt(Math.abs(bal));
    balEl.style.color = bal >= 0 ? 'var(--primary)' : 'var(--expense)';

    const body = document.getElementById('entries-body');
    const empty = document.getElementById('empty-msg');
    const table = document.getElementById('entries-table');
    document.getElementById('entry-count').textContent = monthEntries.length + '件';
    if (monthEntries.length === 0) {
      body.innerHTML = '';
      table.style.display = 'none';
      empty.style.display = 'block';
    } else {
      table.style.display = '';
      empty.style.display = 'none';
      body.innerHTML = monthEntries.map(e => `
        <tr>
          <td>${escapeHtml(e.date.slice(5).replace('-', '/'))}</td>
          <td>${escapeHtml(e.category)}</td>
          <td>${escapeHtml(e.memo || '')}</td>
          <td class="amount ${e.type === 'income' ? 'income' : 'expense'}">${e.type === 'income' ? '+' : '-'}${fmt(e.amount)}</td>
          <td><button class="delete-btn" data-id="${Number(e.id)}" title="削除">×</button></td>
        </tr>
      `).join('');
    }

    renderChart(monthEntries.filter(e => e.type === 'expense'));
    renderBudgets(monthEntries.filter(e => e.type === 'expense'));
    renderYearly();
  }

  function renderBudgets(monthExpenses) {
    const spent = {};
    monthExpenses.forEach(e => { spent[e.category] = (spent[e.category] || 0) + e.amount; });
    const list = document.getElementById('budget-list');
    const cats = Object.keys(budgets).filter(c => budgets[c] > 0);
    if (cats.length === 0) {
      list.innerHTML = '<div class="budget-empty">まだ予算が設定されていません。下のフォームから追加できます。</div>';
      return;
    }
    cats.sort((a, b) => CATEGORIES.expense.indexOf(a) - CATEGORIES.expense.indexOf(b));
    list.innerHTML = cats.map(cat => {
      const budget = budgets[cat];
      const used = spent[cat] || 0;
      const pct = budget > 0 ? (used / budget) * 100 : 0;
      const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
      const width = Math.min(pct, 100);
      const safeCat = escapeHtml(cat);
      return `
        <div class="budget-row">
          <div class="budget-head">
            <span class="budget-cat">${safeCat} <button class="delete-btn" data-budget="${safeCat}" title="予算を削除" style="padding:0 4px;font-size:14px;">×</button></span>
            <span class="budget-nums">${fmt(used)} / ${fmt(budget)}<span class="pct">${pct.toFixed(0)}%</span></span>
          </div>
          <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${width}%"></div></div>
        </div>`;
    }).join('');
  }

  function renderYearly() {
    const base = new Date(viewMonth);
    const labels = [];
    const incomes = [];
    const expenses = [];
    const balances = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      const key = ym(d);
      labels.push((d.getMonth() + 1) + '月');
      const monthEntries = entries.filter(e => e.date.startsWith(key));
      const inc = monthEntries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
      const exp = monthEntries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
      incomes.push(inc);
      expenses.push(exp);
      balances.push(inc - exp);
    }
    const ctx = document.getElementById('yearly-chart').getContext('2d');
    if (yearlyChart) yearlyChart.destroy();
    yearlyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: '収入', data: incomes, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.3, fill: false },
          { label: '支出', data: expenses, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', tension: 0.3, fill: false },
          { label: '収支', data: balances, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', tension: 0.3, fill: true, borderWidth: 2 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom' },
          tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmt(c.parsed.y)}` } },
        },
        scales: {
          y: { ticks: { callback: (v) => '¥' + v.toLocaleString('ja-JP') } },
        },
      },
    });
  }

  function refreshBudgetCategorySelect() {
    const sel = document.getElementById('budget-category');
    sel.innerHTML = CATEGORIES.expense.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function sanitizeEntry(e) {
    if (!e || typeof e !== 'object') return null;
    const type = e.type === 'income' ? 'income' : 'expense';
    const date = typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : null;
    const amount = Number(e.amount);
    if (!date || !Number.isFinite(amount) || amount <= 0) return null;
    const allowedCats = allCategories(type);
    const category = allowedCats.includes(e.category) ? e.category : CATEGORIES[type][0];
    const memo = typeof e.memo === 'string' ? e.memo.slice(0, 200) : '';
    const id = Number.isFinite(Number(e.id)) ? Number(e.id) : Date.now() + Math.random();
    return { id, type, date, category, memo, amount: Math.round(amount) };
  }

  function sanitizeBudgets(b) {
    if (!b || typeof b !== 'object') return {};
    const out = {};
    for (const cat of allCategories('expense')) {
      const v = Number(b[cat]);
      if (Number.isFinite(v) && v > 0) out[cat] = Math.round(v);
    }
    return out;
  }

  function renderChart(expenseEntries) {
    const byCat = {};
    expenseEntries.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
    const labels = Object.keys(byCat);
    const data = labels.map(l => byCat[l]);
    const ctx = document.getElementById('chart').getContext('2d');
    if (chart) chart.destroy();
    if (labels.length === 0) {
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      return;
    }
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 12 } } },
          tooltip: {
            callbacks: {
              label: (c) => {
                const total = data.reduce((a, b) => a + b, 0);
                const pct = ((c.parsed / total) * 100).toFixed(1);
                return `${c.label}: ${fmt(c.parsed)} (${pct}%)`;
              },
            },
          },
        },
      },
    });
  }

  document.querySelectorAll('.type-toggle button').forEach(b => {
    b.addEventListener('click', () => setType(b.dataset.type));
  });

  document.getElementById('entry-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const entry = {
      id: Date.now(),
      type: currentType,
      date: document.getElementById('date').value,
      category: document.getElementById('category').value,
      memo: document.getElementById('memo').value.trim(),
      amount: parseInt(document.getElementById('amount').value, 10),
    };
    entries.push(entry);
    save();
    document.getElementById('amount').value = '';
    document.getElementById('memo').value = '';
    render();
  });

  document.getElementById('entries-body').addEventListener('click', (e) => {
    if (e.target.classList.contains('delete-btn')) {
      const id = Number(e.target.dataset.id);
      if (confirm('この記録を削除しますか?')) {
        entries = entries.filter(x => x.id !== id);
        save();
        render();
      }
    }
  });

  document.getElementById('prev-month').addEventListener('click', () => {
    viewMonth.setMonth(viewMonth.getMonth() - 1);
    render();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    viewMonth.setMonth(viewMonth.getMonth() + 1);
    render();
  });

  document.getElementById('export-btn').addEventListener('click', () => {
    const payload = { entries, budgets };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kakeibo-${ym(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('import-btn').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const rawEntries = Array.isArray(data) ? data : data.entries;
        const rawBudgets = Array.isArray(data) ? null : data.budgets;
        if (!Array.isArray(rawEntries)) throw new Error('形式が正しくありません');
        const cleanEntries = rawEntries.map(sanitizeEntry).filter(Boolean);
        const cleanBudgets = rawBudgets ? sanitizeBudgets(rawBudgets) : null;
        if (confirm(`${cleanEntries.length}件のデータを読み込みます。既存データに追加しますか? (キャンセルで上書き)`)) {
          entries = entries.concat(cleanEntries);
          if (cleanBudgets) budgets = Object.assign({}, budgets, cleanBudgets);
        } else {
          entries = cleanEntries;
          if (cleanBudgets) budgets = cleanBudgets;
        }
        save();
        saveBudgets();
        render();
      } catch (err) {
        alert('読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('budget-save').addEventListener('click', () => {
    const cat = document.getElementById('budget-category').value;
    const amountStr = document.getElementById('budget-amount').value;
    const amount = parseInt(amountStr, 10);
    if (!cat || isNaN(amount) || amount < 0) {
      alert('カテゴリと金額を入力してください');
      return;
    }
    if (amount === 0) delete budgets[cat];
    else budgets[cat] = amount;
    saveBudgets();
    document.getElementById('budget-amount').value = '';
    render();
  });

  document.getElementById('budget-category').addEventListener('change', (e) => {
    const cat = e.target.value;
    document.getElementById('budget-amount').value = budgets[cat] || '';
  });

  document.getElementById('budget-list').addEventListener('click', (e) => {
    if (e.target.dataset.budget) {
      const cat = e.target.dataset.budget;
      if (confirm(`${cat} の予算を削除しますか?`)) {
        delete budgets[cat];
        saveBudgets();
        render();
      }
    }
  });

  const DATE_HEADERS = ['利用日', 'ご利用日', '取引日', '日付', '日時', 'date', 'transaction date'];
  const AMOUNT_HEADERS = ['利用金額', 'ご利用金額', '金額', '請求金額', 'amount', '利用額', 'ご利用金額(円)'];
  const DESC_HEADERS = ['利用店名', 'ご利用店舗', '利用店舗', '店名', '店舗', '摘要', '内容', '備考', '利用先', 'description', 'merchant'];

  function normalizeHeader(s) { return String(s || '').toLowerCase().replace(/\s+/g, '').replace(/[・(（）)]/g, ''); }
  function matchHeader(cell, candidates) {
    const n = normalizeHeader(cell);
    return candidates.some(c => n.includes(normalizeHeader(c)));
  }

  function parseDateCell(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      const d = XLSX.SSF.parse_date_code(v);
      if (d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    }
    if (v instanceof Date && !isNaN(v)) {
      return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m) {
      const y = m[3].length === 2 ? '20' + m[3] : m[3];
      return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    }
    const d = new Date(s);
    if (!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return null;
  }

  function parseAmountCell(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Math.abs(Math.round(v));
    const s = String(v).replace(/[,¥￥\s円]/g, '').replace(/[()]/g, '');
    const n = Number(s);
    return Number.isFinite(n) ? Math.abs(Math.round(n)) : null;
  }

  function detectColumns(rows) {
    for (let r = 0; r < Math.min(8, rows.length); r++) {
      const row = rows[r] || [];
      let date = -1, amount = -1, desc = -1;
      for (let c = 0; c < row.length; c++) {
        const cell = row[c];
        if (date < 0 && matchHeader(cell, DATE_HEADERS)) date = c;
        if (amount < 0 && matchHeader(cell, AMOUNT_HEADERS)) amount = c;
        if (desc < 0 && matchHeader(cell, DESC_HEADERS)) desc = c;
      }
      if (date >= 0 && amount >= 0) return { headerRow: r, date, amount, desc };
    }
    return null;
  }

  function extractFromRows(rows) {
    const cols = detectColumns(rows);
    if (!cols) return { ok: false, error: '日付列・金額列が見つかりませんでした。ヘッダー行 (利用日 / 金額) を確認してください。' };
    const out = [];
    for (let r = cols.headerRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const date = parseDateCell(row[cols.date]);
      const amount = parseAmountCell(row[cols.amount]);
      if (!date || !amount) continue;
      const desc = cols.desc >= 0 ? String(row[cols.desc] || '').trim().slice(0, 200) : '';
      out.push({ date, amount, memo: desc });
    }
    return { ok: true, items: out };
  }

  function isDuplicate(item) {
    return entries.some(e =>
      e.type === 'expense' && e.date === item.date && e.amount === item.amount && (e.memo || '') === (item.memo || '')
    );
  }

  let pendingItems = [];

  function showCcPreview(items) {
    pendingItems = items;
    const dupFlags = items.map(isDuplicate);
    const newCount = dupFlags.filter(f => !f).length;
    const dupCount = dupFlags.filter(f => f).length;
    const total = items.reduce((s, i, idx) => dupFlags[idx] ? s : s + i.amount, 0);
    document.getElementById('cc-stats').innerHTML =
      `<span>新規: <b>${newCount}件</b></span>` +
      `<span>重複(スキップ): <b>${dupCount}件</b></span>` +
      `<span>登録金額合計: <b>${fmt(total)}</b></span>`;
    const rowsHtml = items.map((i, idx) => `
      <tr class="${dupFlags[idx] ? 'dup' : ''}">
        <td>${escapeHtml(i.date)}</td>
        <td>${escapeHtml(i.memo)}</td>
        <td class="amount">${fmt(i.amount)}</td>
      </tr>`).join('');
    document.getElementById('cc-preview-wrap').innerHTML = `
      <table>
        <thead><tr><th>日付</th><th>店舗・摘要</th><th style="text-align:right">金額</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
    document.getElementById('cc-preview-overlay').style.display = 'flex';
  }

  function hideCcPreview() {
    document.getElementById('cc-preview-overlay').style.display = 'none';
    pendingItems = [];
  }

  document.getElementById('cc-confirm').addEventListener('click', () => {
    const added = [];
    for (const i of pendingItems) {
      if (isDuplicate(i)) continue;
      added.push({
        id: Date.now() + Math.random(),
        type: 'expense',
        date: i.date,
        category: 'クレカ',
        memo: i.memo,
        amount: i.amount,
      });
    }
    entries = entries.concat(added);
    save();
    hideCcPreview();
    render();
    alert(`${added.length}件を登録しました`);
  });
  document.getElementById('cc-cancel').addEventListener('click', hideCcPreview);

  function readCcFile(file) {
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      alert('Excel 解析ライブラリ (SheetJS) が読み込めていません。インターネット接続を確認してください。');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
        const result = extractFromRows(rows);
        if (!result.ok) { alert(result.error); return; }
        if (result.items.length === 0) { alert('登録可能な行が見つかりませんでした'); return; }
        showCcPreview(result.items);
      } catch (e) {
        alert('ファイルを解析できませんでした: ' + e.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  document.getElementById('cc-pick-btn').addEventListener('click', () => document.getElementById('cc-file').click());
  document.getElementById('cc-file').addEventListener('change', (e) => {
    readCcFile(e.target.files[0]);
    e.target.value = '';
  });
  const dropZone = document.getElementById('cc-drop');
  ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
  }));
  dropZone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length) readCcFile(e.dataTransfer.files[0]);
  });

  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
  setType('income');
  refreshBudgetCategorySelect();
  document.getElementById('budget-amount').value = budgets[document.getElementById('budget-category').value] || '';
  render();
</script>
</body>
</html>
